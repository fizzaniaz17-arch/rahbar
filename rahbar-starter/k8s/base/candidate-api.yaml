apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api-candidate
  template:
    metadata:
      labels:
        app: api-candidate
    spec:
      serviceAccountName: api
      automountServiceAccountToken: false
      containers:
      - name: api
        image: rahbar-api:dev
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: rahbar-config
        env:
        - name: CHROMA_COLLECTION
          value: rahbar-candidate
        - name: TRACE_PATH
          value: /traces/candidate-traces.jsonl
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '1'
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          periodSeconds: 10
        volumeMounts:
        - name: traces
          mountPath: /traces
      volumes:
      - name: traces
        persistentVolumeClaim:
          claimName: rahbar-traces
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
