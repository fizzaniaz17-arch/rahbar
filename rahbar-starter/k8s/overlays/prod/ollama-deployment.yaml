apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: rahbar
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      automountServiceAccountToken: false
      containers:
      - name: ollama
        image: ollama/ollama:0.9.6
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 11434
          protocol: TCP
        readinessProbe:
          tcpSocket:
            port: 11434
          timeoutSeconds: 1
          periodSeconds: 10
          failureThreshold: 3
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-models
