apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
- ../../base
- corpus-pvc.yaml
- model-egress.yaml
patches:
- target:
    kind: ConfigMap
    name: rahbar-config
  patch: |-
    - op: replace
      path: /data/RETRIEVER
      value: chroma
    - op: replace
      path: /data/LLM_PROVIDER
      value: ollama-incluster
    - op: replace
      path: /data/EMBED_MODEL
      value: nomic-embed-text
    - op: replace
      path: /data/CHROMA_COLLECTION
      value: rahbar-real
    - op: add
      path: /data/OLLAMA_URL
      value: http://ollama:11434
- target:
    kind: Job
    name: indexer
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args
      value: []
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value: {name: corpus, mountPath: /corpus, readOnly: true}
    - op: add
      path: /spec/template/spec/volumes/-
      value: {name: corpus, persistentVolumeClaim: {claimName: rahbar-corpus}}
- target:
    kind: CronJob
    name: reindex
  patch: |-
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/args
      value: []
    - op: add
      path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts/-
      value: {name: corpus, mountPath: /corpus, readOnly: true}
    - op: add
      path: /spec/jobTemplate/spec/template/spec/volumes/-
      value: {name: corpus, persistentVolumeClaim: {claimName: rahbar-corpus}}
