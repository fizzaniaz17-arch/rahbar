apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
- ../../base
- corpus-pvc.yaml
- model-egress.yaml
- ollama-models-pvc.yaml
- ollama-deployment.yaml
patches:
- target:
    kind: ConfigMap
    name: rahbar-config
  patch: |-
    - op: replace
      path: /data/RETRIEVER
      value: chroma
    - op: replace
      path: /data/LLM_PROVIDER
      value: ollama-incluster
    - op: replace
      path: /data/EMBED_MODEL
      value: nomic-embed-text
    - op: replace
      path: /data/CHROMA_COLLECTION
      value: rahbar-real
    - op: replace
      path: /data/CHUNK_SIZE
      value: '250'
    - op: replace
      path: /data/CHUNK_OVERLAP
      value: '25'
    - op: add
      path: /data/OLLAMA_URL
      value: http://ollama:11434
- target:
    kind: Job
    name: indexer
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/args
      value: []
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value: {name: corpus, mountPath: /corpus, readOnly: true}
    - op: add
      path: /spec/template/spec/volumes/-
      value: {name: corpus, persistentVolumeClaim: {claimName: rahbar-corpus}}
- target:
    kind: CronJob
    name: reindex
  patch: |-
    - op: replace
      path: /spec/jobTemplate/spec/template/spec/containers/0/args
      value: []
    - op: add
      path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts/-
      value: {name: corpus, mountPath: /corpus, readOnly: true}
    - op: add
      path: /spec/jobTemplate/spec/template/spec/volumes/-
      value: {name: corpus, persistentVolumeClaim: {claimName: rahbar-corpus}}
- target:
    kind: Deployment
    name: api
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/image
      value: rahbar-api:evalshort
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: LLM_MODEL,       value: llama3.2:3b}
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: OLLAMA_TIMEOUT, value: '180'}
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value: {name: OLLAMA_NUM_PREDICT, value: '128'}
