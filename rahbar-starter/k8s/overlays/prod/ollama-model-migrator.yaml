apiVersion: v1
kind: Pod
metadata:
  name: ollama-model-migrator
  namespace: rahbar
spec:
  restartPolicy: Never
  containers:
  - name: migrator
    image: ollama/ollama:0.9.6
    imagePullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -c
    - sleep 3600
    volumeMounts:
    - name: models
      mountPath: /root/.ollama
  volumes:
  - name: models
    persistentVolumeClaim:
      claimName: ollama-models
