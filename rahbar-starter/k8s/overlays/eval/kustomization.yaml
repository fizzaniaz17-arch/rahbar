apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: rahbar
resources:
- ../prod
patches:
- target:
    kind: ConfigMap
    name: rahbar-config
  patch: |-
    - op: add
      path: /data/LLM_MODEL
      value: llama3.2:1b
    - op: replace
      path: /data/CHUNK_SIZE
      value: '400'
    - op: replace
      path: /data/CHUNK_OVERLAP
      value: '50'
- target:
    kind: Job
    name: indexer
  patch: |-
    - op: replace
      path: /spec/template/spec/volumes/1
      value: {name: corpus, configMap: {name: fixture-corpus}}
- target:
    kind: CronJob
    name: reindex
  patch: |-
    - op: add
      path: /spec/suspend
      value: true
